<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0"/>

  <title>Birthday Web</title>

  <!-- PIXEL FONT -->

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
  rel="stylesheet">

  <!-- FONT FORM 2 -->

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
  rel="stylesheet">

  <link rel="stylesheet" href="brithday.css">

</head>

<body>

 <audio id="bgMusic" loop>
  <source src="assets/shape.mp3" type="audio/mp3">
</audio>

  <!-- ================= FORM 1 ================= -->

  <div class="container" id="form1">

    <!-- CLOUD -->

    <img src="assets/cloudpixel.png"
    class="cloud cloud1">

    <img src="assets/cloudpixel.png"
    class="cloud cloud2">

    <img src="assets/cloudpixel.png"
    class="cloud cloud3">

    <!-- LOVE GIF -->

    <img src="assets/gif.gif"
    class="love love1">

    <img src="assets/gif.gif"
    class="love love2">

    <img src="assets/gif.gif"
    class="love love3">

    <img src="assets/gif.gif"
    class="love love4">

    <!-- LEFT -->

    <div class="left-content">

      <img src="assets/Game Love Sticker.gif"
      class="small-duck">

      <h1 id="typingText"></h1>

      <button id="openBtn">
        click me !
      </button>

    </div>

    <!-- RIGHT -->

    <div class="right-content">

      <img src="assets/Happy Pixel Sticker.gif"
      class="big-duck">

    </div>

  </div>

  <!-- ================= FORM 2 ================= -->

  <div class="gift-page" id="form2">

    <!-- CLOUD -->

    <img src="assets/cloud.png"
    class="gift-cloud gift-cloud1">

    <img src="assets/cloud.png"
    class="gift-cloud gift-cloud2">

    <img src="assets/cloud.png"
    class="gift-cloud gift-cloud3">

    <img src="assets/cloud.png"
    class="gift-cloud gift-cloud4">

    <!-- CONTENT -->
    <div class="gift-content">

      <img src="assets/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love1">

    <img src="assets/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love2">

    <img src="assets/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love3">

    <img src="assets/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love4">

    <!-- LOVE BARU -->

    <img src="assets/Heart Love Sticker by Princess Polly Boutique.gif"
    class="gift-love gift-love5">

    <img src="assets/Heart Love Sticker by Princess Polly Boutique.gif"
    class="gift-love gift-love6">

    <!-- FLOWER -->

    <img src="assets/flowers STICKER.gif"
    class="bottom-flower flower-left">

    <!-- ROSE PETALS -->
    <img src="assets/Rose Petals Art Sticker.gif"
    class="right-flower">

      <!-- TITLE -->

      <h2 class="gift-title">
        You have a <br>
        GIFT!
      </h2>

      <!-- OPEN BUTTON -->

      <button id="giftBtn"
      class="gift-button">
        open gift ?
      </button>

      <!-- OPENING TEXT -->

      <h3 id="openingText"></h3>

      <!-- CAT -->

      <img src="assets/Black Cat Sticker.gif"
      class="cat-gif"
      id="catGif">

      <!-- GIFT GIF -->

      <img src="assets/Gift Sticker by Iris Tattoo.gif"
      class="gift-box-gif"
      id="giftGif">

      <!-- CHECK BUTTON -->

      <button id="checkBtn"
      class="gift-button">
        check it out!
      </button>

    </div>

  </div>

  <!-- ================= FORM 3 ================= -->

<div class="birthday-page" id="form3">

  <!-- BALLOON -->

  <img src="assets/Balloon Love Sticker by Folksy.gif"
  class="balloon balloon-left">

  <img src="assets/Balloon Love Sticker by Folksy.gif"
  class="balloon balloon-right">

  <img src="assets/Heart Love Sticker by Folksy.gif"
  class="birthday-love birthday-love1">

  <img src="assets/Heart Love Sticker by Folksy.gif"
  class="birthday-love birthday-love2">

  <img src="assets/Heart Love Sticker by Folksy.gif"
  class="birthday-love birthday-love3">

  <img src="assets/Summer Sea Sticker.gif"
  class="summer summer1">

  <img src="assets/Summer Sea Sticker.gif"
  class="summer summer2">

  <!-- CONTENT -->

  <div class="birthday-content">

    <!-- TEXT -->

    <h2 class="birthday-title"
    id="birthdayText"></h2>

    <!-- HELLO KITTY -->

    <img src="assets/Hello Kitty Pixel Sticker.gif"
    class="sanrio-gif">

    <!-- CAKE -->

    <img src="assets/Happy Birthday Party Sticker by Amy.gif"
    class="birthday-cake">

    <!-- BUTTON -->

    <button id="nextBtn">
      next...
    </button>

  </div>

</div>

<!-- ================= FORM 4 ================= -->

<div class="snoopy-page" id="form4">

  <div class="snoopy-box">

    <!-- TEXT -->

    <h2 id="snoopyText"></h2>

    <!-- SNOOPY -->

    <img src="assets/Excited The Peanuts Gang Sticker by Peanuts.gif"
    class="snoopy-walk"
    id="snoopyWalk">

    <!-- BUTTON -->

    <button id="snoopyNextBtn">
      next...
    </button>

  </div>

</div>

<!-- ================= FORM 5 ================= -->

<div class="letter-page" id="form5">

  <div class="letter-box">

    <!-- TOP TEXT -->

    <h2 class="from-text">
      from me...
    </h2>

    <h2 class="to-text"
    id="toText"></h2>

    <!-- GIF -->

    <img src="assets/Hello Kitty Pixel Sticker (1).gif"
    class="kuromi-gif">

    <img src="assets/My Melody Pixel Sticker.gif"
    class="melody-gif">

    <!-- MESSAGE -->

    <p class="love-message"
    id="loveMessage"></p>

    

  </div>

</div>

  <script src="brithday.js"></script>

</body>
</html>
